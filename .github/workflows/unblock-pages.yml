name: Desbloquear despliegue de LeanBike Pages

on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/unblock-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  close-stale-record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cerrar solo el registro antiguo verificado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record="repos/${GITHUB_REPOSITORY}/deployments/7470386260"
          actual_sha=$(gh api "$record" --jq .sha)
          test "$actual_sha" = "83d121e615d1ddacf6a11a79cfed64259d7eb375"
          gh api --method POST "$record/statuses" \
            -f state=inactive \
            -F auto_inactive=false \
            -f description="Cierre del registro antiguo ya completado para desbloquear Pages"
