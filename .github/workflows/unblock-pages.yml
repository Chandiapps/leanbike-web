name: Finalizar reparación de LeanBike Pages

on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/unblock-pages.yml]

permissions:
  contents: read
  pages: write
  deployments: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar después de retirar esta acción y cerrar sus registros
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 90
          repo="repos/${GITHUB_REPOSITORY}"
          target=$(gh api "$repo/git/ref/heads/gh-pages" --jq .object.sha)
          test "$(gh api "$repo/commits/$target" --jq '.parents[0].sha')" = "$GITHUB_SHA"
          test "$(gh api "$repo/commits/$target" --jq '.files | length')" = "1"
          test "$(gh api "$repo/commits/$target" --jq '.files[0].filename')" = ".github/workflows/unblock-pages.yml"
          test "$(gh api "$repo/commits/$target" --jq '.files[0].status')" = "removed"
          old=$(gh api "$repo/deployments?sha=e85ff96172b4b851e8c418ce0561a641c91b5988&per_page=1" --jq '.[0].id')
          test "$(gh api "$repo/deployments/$old" --jq .sha)" = "e85ff96172b4b851e8c418ce0561a641c91b5988"
          gh api --method POST "$repo/deployments/$old/statuses" -f state=inactive -F auto_inactive=false --silent
          before=$(gh api "$repo/deployments?sha=$target&per_page=1" --jq '.[0].id // 0')
          gh api --method POST "$repo/pages/builds" --silent
          for i in $(seq 1 72); do
            sleep 5
            current=$(gh api "$repo/deployments?sha=$target&per_page=1" --jq '.[0].id // 0')
            if [ "$current" = "0" ] || [ "$current" = "$before" ]; then continue; fi
            state=$(gh api "$repo/deployments/$current/statuses?per_page=1" --jq '.[0].state')
            if [ "$state" = "success" ]; then
              gh api --method POST "$repo/deployments/$current/statuses" -f state=inactive -F auto_inactive=false --silent
              echo "Publicación final verificada; acción temporal retirada y registro cerrado."
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then echo "Pages no terminó correctamente"; exit 1; fi
          done
          echo "Tiempo de espera agotado sin declarar publicación correcta"
          exit 1
